<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Marketplace — Create Creator Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark">AI</span>
      AI Marketplace
    </div>
  </header>

  <main class="page-main">
    <div class="back-nav">
      <a href="{{ url_for('creator_auth') }}" class="btn btn-ghost">&larr; Back</a>
    </div>

    <div class="page-heading">
      <span class="eyebrow">Creator</span>
      <h1>Create your creator account</h1>
      <p>Set up your profile to start publishing AI models.</p>
    </div>

    <div class="card form-card">
      <div class="alert" id="form-alert"></div>

      <div class="helper-note">Your email address will be your Login ID.</div>

      <form id="creator-register-form" novalidate>

        <div class="form-group">
          <label for="creator-name">Creator Name</label>
          <input type="text" id="creator-name" name="creator_name" data-field="name" data-error-for="creator-name-error" placeholder="Jane Doe">
          <span class="field-error" id="creator-name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" data-field="email" data-error-for="email-error" placeholder="jane@example.com">
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="contact">Contact Number</label>
          <input type="tel" id="contact" name="contact" data-field="contact" data-error-for="contact-error" placeholder="+91 98765 43210">
          <span class="field-error" id="contact-error"></span>
        </div>

        <div class="form-group">
          <label>Status</label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" id="status-student" name="status" value="student">
              <label for="status-student">Student</label>
            </div>
            <div class="radio-option">
              <input type="radio" id="status-working" name="status" value="working">
              <label for="status-working">Working</label>
            </div>
          </div>
          <span class="field-error" id="status-error"></span>
        </div>

        <div class="form-group">
          <label for="password">Create Password</label>
          <input type="password" id="password" name="password" data-field="password" data-error-for="password-error" placeholder="At least 6 characters">
          <span class="field-error" id="password-error"></span>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirm Password</label>
          <input type="password" id="confirm-password" name="confirm_password" data-field="confirm-password" data-error-for="confirm-password-error" placeholder="Re-enter password">
          <span class="field-error" id="confirm-password-error"></span>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Create Creator Account</button>
        </div>
      </form>

      <div class="form-footer">
        Already have an account? <a href="{{ url_for('creator_login') }}">Login</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    &copy; 2026 AI Marketplace. Built for a hackathon.
  </footer>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  <script>
    setupRegistrationForm('creator-register-form', "{{ url_for('creator_login') }}");
  </script>
</body>
</html>
