{% extends "base_auth.html" %}
{% block title %}Create Creator Account — AI Marketplace{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Become a Creator</h1>
  <p class="sub">Register to list your AI models on the marketplace.</p>

  <form method="POST">
    <label>Creator Name</label>
    <input type="text" name="name" value="{{ form.get('name','') }}" required>

    <label>Email Address</label>
    <input type="email" name="email" value="{{ form.get('email','') }}" required>

    <label>Contact Number</label>
    <input type="text" name="contact_number" value="{{ form.get('contact_number','') }}" required>

    <label>Student / Working</label>
    <select name="status" required>
      <option value="" disabled {% if not form.get('status') %}selected{% endif %}>Select one</option>
      <option value="student" {% if form.get('status')=='student' %}selected{% endif %}>Student</option>
      <option value="working" {% if form.get('status')=='working' %}selected{% endif %}>Working</option>
    </select>

    <label>Password</label>
    <input type="password" name="password" required>

    <label>Confirm Password</label>
    <input type="password" name="confirm_password" required>

    <button type="submit" class="btn-primary">Create Creator Account</button>
  </form>

  <p class="switch-link">Already a creator? <a href="{{ url_for('auth.creator_login') }}">Log in</a></p>
</div>
{% endblock %}
