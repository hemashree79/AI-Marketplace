{% extends "base_auth.html" %}
{% block title %}Upload New AI Model — AI Marketplace{% endblock %}
{% block content %}
<div class="auth-card upload-card">
  <h1>Upload New AI Model</h1>
  <p class="sub">Submit a model for admin review. It stays hidden from the marketplace until approved.</p>

  <form method="POST" enctype="multipart/form-data">
    <label>Model Name</label>
    <input type="text" name="name" value="{{ form.get('name','') }}" required>

    <label>Model Logo</label>
    <input type="file" name="logo" accept=".png,.jpg,.jpeg,.webp">

    <label>Description</label>
    <textarea name="description" rows="3" required>{{ form.get('description','') }}</textarea>

    <label>Category</label>
    <input type="text" name="category" value="{{ form.get('category','') }}" placeholder="e.g. Natural Language Processing" required>

    <label>Model Type</label>
    <select name="model_type" required>
      <option value="" disabled {% if not form.get('model_type') %}selected{% endif %}>Select one</option>
      {% for t in model_types %}
      <option value="{{ t }}" {% if form.get('model_type')==t %}selected{% endif %}>{{ t }}</option>
      {% endfor %}
    </select>

    <label>Version</label>
    <input type="text" name="version" value="{{ form.get('version','') }}" placeholder="e.g. 1.0">

    <label>Use Cases</label>
    <textarea name="use_cases" rows="2">{{ form.get('use_cases','') }}</textarea>

    <label>Features</label>
    <textarea name="features" rows="2">{{ form.get('features','') }}</textarea>

    <label>Technical Requirements</label>
    <textarea name="technical_requirements" rows="2">{{ form.get('technical_requirements','') }}</textarea>

    <label>API Available</label>
    <select name="api_available" required>
      <option value="" disabled {% if not form.get('api_available') %}selected{% endif %}>Select one</option>
      <option value="yes" {% if form.get('api_available')=='yes' %}selected{% endif %}>Yes</option>
      <option value="no" {% if form.get('api_available')=='no' %}selected{% endif %}>No</option>
    </select>

    <label>Accuracy</label>
    <input type="text" name="accuracy" value="{{ form.get('accuracy','') }}" placeholder="e.g. 92%">

    <label>Performance</label>
    <input type="text" name="performance" value="{{ form.get('performance','') }}" placeholder="e.g. Fast">

    <label>Monthly Price (USD)</label>
    <input type="number" step="0.01" min="0" name="monthly_price" value="{{ form.get('monthly_price','') }}" required>

    <label>Yearly Price (USD)</label>
    <input type="number" step="0.01" min="0" name="yearly_price" value="{{ form.get('yearly_price','') }}" required>

    <button type="submit" class="btn-primary">Submit for Review</button>
  </form>

  <p class="switch-link"><a href="{{ url_for('auth.creator_dashboard') }}">&larr; Back to dashboard</a></p>
</div>
{% endblock %}
