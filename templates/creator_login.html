{% extends "base_auth.html" %}
{% block title %}Creator Login — AI Marketplace{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Creator Login</h1>
  <p class="sub">Log in to manage your AI models.</p>

  <form method="POST">
    <label>Email Address</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit" class="btn-primary">Log In</button>
  </form>

  <p class="switch-link">Don't have a creator account? <a href="{{ url_for('auth.creator_register') }}">Create one</a></p>
</div>
{% endblock %}
