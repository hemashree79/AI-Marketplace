{% extends "base_auth.html" %}
{% block title %}Admin Login — AI Marketplace{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Admin Login</h1>
  <p class="sub">Restricted access. Admin accounts are not self-registered.</p>

  <form method="POST">
    <label>Admin Login ID</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit" class="btn-primary">Log In</button>
  </form>
</div>
{% endblock %}
